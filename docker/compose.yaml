name: miniops-lab

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: miniops-web:1.0
    ports:
      - "127.0.0.1:8082:80"
    networks:
      - lab-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  toolbox:
    image: alpine:3.22
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    volumes:
      - lab-data:/data
    networks:
      - lab-net

networks:
  lab-net:
    driver: bridge

volumes:
  lab-data:


apiVersion: v1
kind: ServiceAccount
metadata:
  name: miniops-viewer
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: miniops-pod-reader
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: miniops-viewer-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: miniops-viewer
    namespace: default
roleRef:
  kind: Role
  name: miniops-pod-reader
  apiGroup: rbac.authorization.k8s.io

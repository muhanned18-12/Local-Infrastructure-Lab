
apiVersion: v1
kind: Pod

metadata:
  name: miniops-readiness-test
  labels:
    app: miniops-web
    lab-test: readiness

spec:
  containers:
    - name: web
      image: miniops-web:1.0
      imagePullPolicy: IfNotPresent

      ports:
        - containerPort: 80

      readinessProbe:
        httpGet:
          path: /readiness-test-not-found
          port: 80
        initialDelaySeconds: 1
        periodSeconds: 5
        failureThreshold: 2

      livenessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 10
        failureThreshold: 3

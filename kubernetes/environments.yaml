
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniops-web
  namespace: miniops-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: miniops-web
  template:
    metadata:
      labels:
        app: miniops-web
    spec:
      containers:
        - name: web
          image: miniops-web:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: miniops-settings
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniops-web
  namespace: miniops-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: miniops-web
  template:
    metadata:
      labels:
        app: miniops-web
    spec:
      containers:
        - name: web
          image: miniops-web:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: miniops-settings
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10

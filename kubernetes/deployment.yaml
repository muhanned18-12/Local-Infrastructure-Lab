apiVersion: apps/v1
kind: Deployment

metadata:
  name: miniops-web
  labels:
    app: miniops-web

spec:
  replicas: 3

  selector:
    matchLabels:
      app: miniops-web

  template:
    metadata:
      labels:
        app: miniops-web

    spec:
      containers:
        - name: web
          image: miniops-web:1.0
          imagePullPolicy: IfNotPresent


          envFrom:
            - configMapRef:
                name: miniops-config

          env:
            - name: DEMO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: miniops-demo-secret
                  key: DEMO_API_TOKEN

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
